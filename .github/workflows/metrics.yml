name: Metrics

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Kuala_Lumpur
          # Personal repos plus every org repo (Assafa-Academy, AlQISC-AIU), public and private
          repositories_affiliations: owner, organization_member
          plugin_languages: yes
          # Repos written mostly by other people; indepth mode would filter by author
          # but needs well over an hour for this history, so they are listed here instead
          plugin_languages_skipped: >-
            Assafa-Academy/LMS_FE, Assafa-Academy/LMS_V2, Assafa-Academy/lms,
            Assafa-Academy/lms_mobile, Assafa-Academy/docs,
            AlQISC-AIU/AlQISC_Website, AlQISC-AIU/demo-repository,
            mh2des/ALMATAR-CAR-WASH-backup
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
